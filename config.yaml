seed: 42

paths:
  train_dir: data/train
  test_dir: data/test
  train_labels: data/train_labels.csv
  output_dir: outputs

categories:
  - Account Management
  - Investment Advisory
  - Loan Processing
  - Insurance Claims
  - Other

model:
  # min_df=1: at 44 documents anything higher drops discriminative words that
  # happen to appear once. Bigrams catch "loan officer". Untuned defaults.
  tfidf:
    max_features: 5000
    ngram_range: [1, 2]
    stop_words: english
    min_df: 1
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: balanced

routing:
  # Calibrated-confidence cutoff for auto-route vs. needs_review, read off the
  # coverage/accuracy curve (`python -m src.routing`): at 0.45, 89.1% of
  # predictions auto-route at 100.0% accuracy while the reviewed 10.9% is only
  # 75.0% accurate. An ordinal choice — post-calibration ECE (0.359) is too
  # coarse to treat this as P(correct) in a cost calculation.
  auto_route_threshold: 0.45
