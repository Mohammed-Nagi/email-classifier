# Central configuration for the email classifier pipeline.
# Grows incrementally as later build steps need new settings — no keys are
# pre-declared for functionality that does not exist yet.

seed: 42

paths:
  train_dir: data/train
  test_dir: data/test
  train_labels: data/train_labels.csv
  output_dir: outputs

categories:
  - Account Management
  - Investment Advisory
  - Loan Processing
  - Insurance Claims
  - Other

model:
  # TF-IDF: min_df=1 because the corpus is only 44 documents — any higher
  # would drop discriminative words that happen to appear once. ngram_range
  # (1, 2) captures short department-naming phrases ("loan officer").
  tfidf:
    max_features: 5000
    ngram_range: [1, 2]
    stop_words: english
    min_df: 1
  # Logistic Regression: class_weight=balanced because train has mild
  # imbalance (13 vs 6 across the 5 classes). Not yet tuned against a CV
  # harness (that lands with evaluate.py) — these are sane defaults.
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: balanced
